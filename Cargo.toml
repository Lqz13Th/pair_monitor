[package]
name = "pair_monitor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local monitor for the cross-venue pair strategy: spreads, convergence, accounts, fills and bot journal."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
extrema_infra = { version = "0.5.3", features = ["hyperliquid"] }
perp_dex = { version = "0.1.4", default-features = false, features = ["lighter"] }
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
